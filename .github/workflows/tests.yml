name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyttsx3 is intentionally NOT installed here: it is an optional
          # TTS dependency and CI has no audio hardware. The Assistant
          # brain and the entire test suite work without it.
          pip install pytest

      - name: Run tests
        run: pytest -v
